steps:
  # 1️⃣ Initialize and update submodules
  - name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        git submodule sync
        git submodule update --init --recursive
        git submodule status

  # 2️⃣ Debug: confirm files exist
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        echo "Listing workspace files:"
        ls -R /workspace
  - name: node:20
    env:
      - ID=${_ID}
    args:
      - /workspace/build/index.js
    entrypoint: node
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - app
      - deploy
      - "--quiet"
      - "--verbosity=debug"
    entrypoint: gcloud
options:
  logging: CLOUD_LOGGING_ONLY
